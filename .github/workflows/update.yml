name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
      - name: Checkout action repo
        uses: actions/checkout@v4
        with:
          repository: HolodoriDB/holodori-db-diff-action
          token: ${{ secrets.ACCESS_TOKEN }}
          ref: "main"
          path: ./action

      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: ./repo

      - name: Install dependencies
        run: npm install --prefix ./action

      - name: Run actions
        id: run_actions
        uses: ./action
        with:
          lang: eng

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          repository: ./repo
          commit_message: Master data version ${{ steps.run_actions.outputs.hash }}
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>